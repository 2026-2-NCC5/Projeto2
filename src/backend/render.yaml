services:
  - type: web
    name: asaconnect-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET_KEY
        value: fecap_asa_connect_secret_key_jwt_2025_prod_super_secure_key_alvarista
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: RAG_CONFIDENCE_THRESHOLD
        value: "0.48"
      - key: RAG_MAX_CHUNKS
        value: "6"
      - key: RAG_EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: KNOWLEDGE_BASE_DIR
        value: ./knowledge_base
      - key: DATABASE_URL
        value: sqlite:///./asaconnect.db
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
