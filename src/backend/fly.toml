# fly.toml app configuration file for ASA Connect+
# Primary region: gru (São Paulo, Brasil - ultra low latency)
# Auto stop machines: off (nunca hiberna)

app = "asa-connect-api"
primary_region = "gru"

[build]

[env]
  APP_NAME = "ASA Connect API"
  API_V1_PREFIX = "/api/v1"
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  JWT_ALGORITHM = "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES = "1440"
  RAG_CONFIDENCE_THRESHOLD = "0.48"
  RAG_MAX_CHUNKS = "3"
  RAG_EMBEDDING_MODEL = "all-MiniLM-L6-v2"
  KNOWLEDGE_BASE_DIR = "/app/knowledge_base"
  DATABASE_URL = "sqlite:////app/asaconnect.db"
  LLM_MODEL = "gemini-2.5-flash"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
